<title>Scadenzario recupero crediti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--carta:#F4F5F1;--inchiostro:#1D2433;--grafite:#566070;--tenue:#8A909B;--filo:#CCD1C7;--bianco:#FFFFFF;--timbro:#5A3D8A;--timbro-velo:#ECE6F5;--avviso:#A9541A;
  --serif:"Libre Caslon Text",Georgia,serif;--sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--inchiostro);color:var(--inchiostro);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.gate{width:100%;max-width:420px;background:var(--carta);border-radius:6px;padding:34px 32px 26px;box-shadow:0 40px 70px -40px rgba(0,0,0,.6)}
.occhiello{margin:0;font:500 11.5px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--grafite)}
h1{margin:12px 0 8px;font:400 34px/1.1 var(--serif);letter-spacing:-.01em}
.sub{margin:0 0 24px;font:400 15px/1.5 var(--sans);color:var(--grafite)}
label{display:block;margin-bottom:7px;font:500 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tenue)}
input{width:100%;background:var(--bianco);border:1px solid var(--filo);border-radius:8px;padding:12px 14px;font:500 16px/1.2 var(--mono);letter-spacing:.06em;color:var(--inchiostro)}
input:focus{outline:2px solid var(--timbro);outline-offset:1px;border-color:var(--timbro)}
button{width:100%;margin-top:12px;border:0;border-radius:8px;background:var(--inchiostro);color:var(--bianco);padding:13px;font:600 14px/1 var(--sans);cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.msg{margin:12px 0 0;min-height:20px;font:400 13px/1.5 var(--sans)}
.msg.err{color:var(--avviso)}
.msg.wait{color:var(--grafite)}
.piede{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--filo);font:400 12px/1.55 var(--sans);color:var(--tenue)}
</style>
</head>
<body>
<main class="gate">
  <p class="occhiello">Presentazione riservata</p>
  <h1>Scadenzario recupero crediti</h1>
  <p class="sub">Il contenuto è cifrato. Per aprirlo serve la password che hai ricevuto a parte.</p>
  <form id="f">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" autofocus>
    <button id="go" type="submit">Apri la presentazione</button>
  </form>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <p class="piede">Senza password la pagina contiene solo dati illeggibili. Se non funziona, chiedila a chi ti ha mandato il link.</p>
</main>

<script>
(() => {
  const P = JSON.parse(document.getElementById('payload').textContent);
  const b2u = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
  const campo = document.getElementById('pw'), btn = document.getElementById('go'), msg = document.getElementById('msg');
  // Accetta la password anche scritta senza trattini, con spazi o maiuscole
  const normalizza = s => { const n = s.toLowerCase().replace(/[\s-]+/g, ''); return /^[a-z0-9]{20}$/.test(n) ? n.match(/.{5}/g).join('-') : s.trim(); };
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = normalizza(campo.value);
    if (!pw) return;
    btn.disabled = true;
    msg.className = 'msg wait';
    msg.textContent = 'Sblocco in corso, un momento…';
    await new Promise(r => setTimeout(r, 30));
    let html;
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name:'PBKDF2', salt:b2u(P.salt), iterations:P.iter, hash:'SHA-256' },
        base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
      html = new TextDecoder().decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv:b2u(P.iv) }, key, b2u(P.ct)));
    } catch (_) {
      msg.className = 'msg err';
      msg.textContent = 'Password non corretta. Controlla e riprova.';
      btn.disabled = false;
      campo.select();
      return;
    }
    document.open(); document.write(html); document.close();
  });
})();
</script>
